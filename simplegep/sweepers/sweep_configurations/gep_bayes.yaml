program: gep_trainer.py
method: bayes
metric:
  goal: maximize
  name: val_acc
parameters:
  batchsize:
    values: [32, 64 ,128]
  num_epochs:
    distribution: int_uniform
    max: 10
    min: 5
  clip_value:
    values: [10.0]
  lr:
    distribution: log_uniform_values
    max: 10.0
    min: 0.1
  weight_decay:
    distribution: uniform
    max: 0.001
    min: 0.0005
  num_basis:
    distribution: int_uniform
    max: 70
    min: 10
  grads_history_size:
    distribution: int_uniform
    max: 200
    min: 100

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  min_iter: 3
