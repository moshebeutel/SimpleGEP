program: gep_trainer.py
method: grid
metric:
  goal: maximize
  name: val_acc
parameters:
  batchsize:
    values: [512, 256]
  num_epochs:
    values: [10, 20, 30]
  clip_value:
    values: [10.0]
  lr:
    values: [0.01, 0.1]
  weight_decay:
    values: [0.0005, 0.001]
  num_basis:
    values: [500, 1000]
  grads_history_size:
    values: [0]
