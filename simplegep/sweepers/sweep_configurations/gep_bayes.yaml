program: dp_sgd_trainer.py
method: bayes
metric:
  goal: maximize
  name: val_acc
parameters:
  batchsize:
    values: [16, 32, 64, 128]
  num_epochs:
    distribution: int_uniform
    max: 150
    min: 10
  clip_value:
    distribution: log_uniform_values
    max: 100.0
    min: 1e-1
  lr:
    distribution: log_uniform_values
    max: 1e-1
    min: 1e-3
  weight_decay:
    distribution: uniform
    max: 0.001
    min: 0.0005
  num_basis:
    distribution: uniform
    max: 2000
    min: 500
  grads_history_size:
    distribution: uniform
    max: 4000
    min: 2000

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  min_iter: 30
